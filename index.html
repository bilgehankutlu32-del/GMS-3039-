<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immersive Gastronomy & Nutrition Matcher</title>
  <style>
    :root {
      --primary: #d94838;
      --primary-dark: #b83628;
      --secondary: #4a7c59;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      line-height: 1.5;
      padding: 30px 16px;
      background-image: url('https://images.unsplash.com/photo-1495195134817-aeb325a55b65?auto=format&fit=crop&w=2000&q=80'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-image 0.8s ease-in-out;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .logo { font-size: 2.2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 10px; }
    .purpose { color: var(--text-muted); font-size: 1.05rem; max-width: 700px; margin: 0 auto; font-style: italic; }

    .music-control { margin-top: 15px; display: inline-block; background: var(--secondary); color: white; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: 700; border: none; font-size: 15px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .music-control:hover { background: #386044; transform: scale(1.02); }

    .search-panel { background: var(--card-bg); border-top: 5px solid var(--primary); border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); margin-bottom: 30px; }

    .input-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .input-row input { flex: 2; min-width: 200px; padding: 12px 16px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
    .input-row select { flex: 1; min-width: 140px; padding: 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; outline: none; cursor: pointer; }
    
    .btn-add { background-color: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer; }

    .user-ingredients-box { min-height: 48px; padding: 10px; background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .tag { background-color: var(--primary-dark); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .tag button { background: none; border: none; color: #fff; cursor: pointer; font-size: 15px; }

    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--card-bg); padding: 10px 20px; border-radius: 8px; }
    .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .recipe-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .recipe-card:hover { transform: translateY(-5px); }
    
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .diet-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .diet-badge { font-size: 10px; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
    .diet-vegan { background: #dcfce7; color: #166534; }
    .diet-vegetarian { background: #fef08a; color: #854d0e; }
    .diet-fitness { background: #e0e7ff; color: #3730a3; }
    
    .match-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #fef3c7; color: #92400e; }
    .match-100 { background: #dcfce7; color: #166534; }
    
    .recipe-card h3 { font-size: 1.2rem; margin-bottom: 10px; }
    .ingredient-list { font-size: 13px; margin-bottom: 14px; }
    .ing-tag { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 4px; font-size: 12px; }
    .ing-have { background: #fbeae8; color: var(--primary-dark); font-weight: 600; }
    .ing-missing { background: #f1f5f9; color: var(--text-muted); text-decoration: line-through; }

    .nutrition-bar { background-color: #f8fafc; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .macros { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>

<audio id="bg-audio" loop></audio>

<div class="container">
  <header>
    <div class="logo">🌍 Immersive Gastronomy Matcher</div>
    <p class="purpose">Search recipes, track macros, and immerse yourself in the culture of your food.</p>
    <button class="music-control" id="music-btn">🎵 Play Global Music</button>
  </header>

  <section class="search-panel">
    <div class="input-row">
      <input type="text" id="ingredient-input" placeholder="Ingredient or meal name...">
      
      <select id="cuisine-filter">
        <option value="All">🌍 All Cuisines</option>
        <option value="Mexican">🌮 Mexican</option>
        <option value="Turkish">🍢 Turkish</option>
        <option value="Italian">🍝 Italian</option>
        <option value="Asian">🍜 Asian</option>
      </select>
      
      <select id="diet-filter">
        <option value="All">🍽️ Any Diet</option>
        <option value="Vegetarian">🥗 Vegetarian</option>
        <option value="Vegan">🌱 Vegan</option>
        <option value="Fitness">💪 Fitness / High Protein</option>
      </select>

      <button class="btn-add" id="btn-add">Add</button>
    </div>
    <div class="user-ingredients-box" id="user-ingredients-box"></div>
  </section>

  <div class="results-header">
    <h2>Suggested Recipes (<span id="results-count">0</span>)</h2>
  </div>
  <section class="recipes-grid" id="recipes-grid"></section>
</div>

<script src="database.js"></script>

<script>
  // VERIFIED OPEN-SOURCE AUDIO & IMAGES
  const themeConfig = {
    "All": { 
        name: "Global", 
        bg: "https://images.unsplash.com/photo-1495195134817-aeb325a55b65?auto=format&fit=crop&w=2000&q=80", 
        audio: "https://assets.mixkit.co/music/preview/mixkit-acoustic-guitar-loop-2287.mp3" 
    },
    "Mexican": { 
        name: "Mexican", 
        bg: "https://images.unsplash.com/photo-1564834724105-918b73d1b9e0?auto=format&fit=crop&w=2000&q=80", 
        audio: "https://assets.mixkit.co/music/preview/mixkit-latin-jazz-guitar-158.mp3" 
    },
    "Turkish": { 
        name: "Turkish", 
        bg: "https://images.unsplash.com/photo-1596797038530-2c107229654b?auto=format&fit=crop&w=2000&q=80", 
        audio: "https://assets.mixkit.co/music/preview/mixkit-middle-eastern-beat-116.mp3" 
    },
    "Italian": { 
        name: "Italian", 
        bg: "https://images.unsplash.com/photo-1498579150354-977475b7ea0b?auto=format&fit=crop&w=2000&q=80", 
        audio: "https://assets.mixkit.co/music/preview/mixkit-classical-piano-and-strings-600.mp3" 
    },
    "Asian": { 
        name: "Asian", 
        bg: "https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=2000&q=80", 
        audio: "https://assets.mixkit.co/music/preview/mixkit-zen-relaxing-spa-background-music-230.mp3" 
    }
  };

  const audioEl = document.getElementById("bg-audio");
  const musicBtn = document.getElementById("music-btn");
  const cuisineFilterEl = document.getElementById("cuisine-filter");
  let isMusicPlaying = false;

  async function updateAndPlayAudio(cuisine) {
    const theme = themeConfig[cuisine] || themeConfig["All"];
    document.body.style.backgroundImage = `url('${theme.bg}')`;

    if (audioEl.src !== theme.audio) {
      audioEl.pause();
      audioEl.src = theme.audio;
      audioEl.load(); 
    }

    if (isMusicPlaying) {
      try {
        await audioEl.play();
        musicBtn.textContent = `⏸️ Pause ${theme.name} Music`;
      } catch (err) {
        isMusicPlaying = false;
        musicBtn.textContent = `🎵 Play ${theme.name} Music`;
      }
    } else {
      musicBtn.textContent = `🎵 Play ${theme.name} Music`;
    }
  }

  musicBtn.addEventListener("click", () => {
    const cuisine = cuisineFilterEl.value;
    const theme = themeConfig[cuisine] || themeConfig["All"];

    if (isMusicPlaying) {
      audioEl.pause();
      isMusicPlaying = false;
      musicBtn.textContent = `🎵 Play ${theme.name} Music`;
    } else {
      audioEl.play().catch(e => console.log(e));
      isMusicPlaying = true;
      musicBtn.textContent = `⏸️ Pause ${theme.name} Music`;
    }
  });

  cuisineFilterEl.addEventListener("change", () => {
    const cuisine = cuisineFilterEl.value;
    updateAndPlayAudio(cuisine);
    evaluateRecipes();
  });

  const userIngredients = new Set();
  const inputEl = document.getElementById("ingredient-input");
  const dietFilterEl = document.getElementById("diet-filter");
  const btnAdd = document.getElementById("btn-add");
  const tagsBox = document.getElementById("user-ingredients-box");
  const recipesGrid = document.getElementById("recipes-grid");
  const resultsCount = document.getElementById("results-count");

  dietFilterEl.addEventListener("change", evaluateRecipes);

  function addIngredient(val) {
    const cleaned = val.trim().toLowerCase();
    if (!cleaned || userIngredients.has(cleaned)) return;
    userIngredients.add(cleaned);
    renderTags();
    evaluateRecipes();
  }

  function removeIngredient(item) {
    userIngredients.delete(item);
    renderTags();
    evaluateRecipes();
  }

  function renderTags() {
    tagsBox.innerHTML = "";
    userIngredients.forEach(ing => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.innerHTML = `${ing} <button type="button" onclick="removeIngredient('${ing}')">&times;</button>`;
      tagsBox.appendChild(tag);
    });
  }

  function evaluateRecipes() {
    const selectedCuisine = cuisineFilterEl.value;
    const selectedDiet = dietFilterEl.value;
    const userArray = Array.from(userIngredients);

    if (typeof recipeDatabase === 'undefined') return;

    let viableRecipes = recipeDatabase;
    if (selectedDiet !== "All") {
      viableRecipes = viableRecipes.filter(r => r.diet.includes(selectedDiet));
    }
    if (selectedCuisine !== "All") {
      viableRecipes = viableRecipes.filter(r => r.cuisine === selectedCuisine);
    }

    if (userIngredients.size === 0) {
      recipesGrid.innerHTML = ``;
      resultsCount.textContent = viableRecipes.length;
      renderCards(viableRecipes.map(r => ({ ...r, matchPct: 0, matched: [], missing: r.ingredients })));
      return;
    }

    const scoredRecipes = viableRecipes.map(recipe => {
      const total = recipe.ingredients.length;
      let matchedCount = 0;
      const matched = [];
      const missing = [];
      const isMealMatch = userArray.some(ing => recipe.name.toLowerCase().includes(ing));

      recipe.ingredients.forEach(ing => {
        if (userIngredients.has(ing.toLowerCase())) {
          matchedCount++; matched.push(ing);
        } else {
          missing.push(ing);
        }
      });

      let matchPct = Math.round((matchedCount / total) * 100);
      if (isMealMatch) { matchPct = 100; matchedCount = total; }
      return { ...recipe, matchedCount, total, matched, missing, matchPct, isMealMatch };
    });

    const filtered = scoredRecipes
      .filter(r => r.matchedCount > 0 || r.isMealMatch)
      .sort((a, b) => b.matchPct - a.matchPct || b.matchedCount - a.matchedCount);

    resultsCount.textContent = filtered.length;
    renderCards(filtered);
  }

  function renderCards(recipes) {
    if (recipes.length === 0) {
      recipesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; background: white; padding: 20px; border-radius: 12px;">No dishes found matching your filters.</div>`;
      return;
    }

    recipesGrid.innerHTML = recipes.map(item => {
      const badgeClass = item.matchPct === 100 ? "match-100" : "";
      const badgeText = item.matchPct > 0 ? (item.isMealMatch ? "Meal Match!" : `${item.matchPct}% Match`) : "Recipe";
      const dietHtml = item.diet.map(d => `<span class="diet-badge diet-${d.toLowerCase()}">${d}</span>`).join("");

      return `
        <div class="recipe-card">
          <div class="card-top">
            <div class="badge-bar">
              <span style="font-size: 11px; font-weight: bold; color: #718096;">${item.cuisine.toUpperCase()}</span>
              ${item.matchPct > 0 ? `<span class="match-badge ${badgeClass}">${badgeText}</span>` : ''}
            </div>
            <h3>${item.name}</h3>
            <div class="diet-tags">${dietHtml}</div>
            <div class="ingredient-list">
              ${item.matched.map(m => `<span class="ing-tag ing-have">✓ ${m}</span>`).join("")}
              ${item.missing.map(m => `<span class="ing-tag ing-missing">${m}</span>`).join("")}
            </div>
          </div>
          <div class="nutrition-bar">
            <div class="macros">
              <span style="color: #e63946;">🔥 ${item.cal} kcal</span>
              <span style="color: #d97706;">🍗 P: ${item.p}g</span>
              <span style="color: #059669;">🍞 C: ${item.c}g</span>
              <span style="color: #475569;">🥑 F: ${item.f}g</span>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  btnAdd.addEventListener("click", () => { addIngredient(inputEl.value); inputEl.value = ""; });
  inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") { addIngredient(inputEl.value); inputEl.value = ""; } });
  
  audioEl.src = themeConfig["All"].audio;
  setTimeout(evaluateRecipes, 100); 
</script>
</body>
</html>
